# Per-GPU layout: this unit (llama-server) becomes the primary GPU's router
# (RTX 4070 SUPER); llama-gpu1.service serves the second GPU and
# llama-split.service the models split across both. Replaces
# zz-placement.conf (the single-router layout).
[Service]
Environment=LD_LIBRARY_PATH=/root/llama.cpp-mixed/build/bin
Environment=VG_LLAMA_ROLE=gpu0
Environment=VG_LLAMA_ROLE_MODELS_DIR=/etc/vram-governor/llama-models-gpu0
Environment=VG_LLAMA_PRESETS=/etc/vram-governor/llama-presets-gpu0.ini
Environment=VG_LLAMA_POOLS=/etc/vram-governor/llama-model-pools-gpu0.json
ExecStartPre=/usr/local/sbin/vram-llama-placement
ExecStart=
ExecStart=/root/llama.cpp-mixed/build/bin/llama-server --host 127.0.0.1 --port 8080 --no-webui --models-dir /etc/vram-governor/llama-models-gpu0 --models-preset /etc/vram-governor/llama-presets-gpu0.ini --models-max 1 --no-models-autoload --metrics
