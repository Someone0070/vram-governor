# Applied after router.conf (drop-ins apply in name order): decide each
# model's GPU placement before every start, and run the CUDA+Vulkan build
# so models can span the NVIDIA and AMD cards. No global --ctx-size or
# --parallel: the router lets them override each model's own pool.
[Service]
# The base unit points LD_LIBRARY_PATH at the CUDA-only build; the mixed
# binary must load its own libggml (with the Vulkan backend).
Environment=LD_LIBRARY_PATH=/root/llama.cpp-mixed/build/bin
ExecStartPre=/usr/local/sbin/vram-llama-placement
ExecStart=
ExecStart=/root/llama.cpp-mixed/build/bin/llama-server --host 127.0.0.1 --port 8080 --no-webui --models-dir /etc/vram-governor/llama-models --models-preset /etc/vram-governor/llama-presets.ini --models-max 1 --no-models-autoload --metrics
