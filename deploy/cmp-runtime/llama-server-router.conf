[Unit]
RequiresMountsFor=/mnt/models/ollama

[Service]
EnvironmentFile=/etc/vram-governor/cmp-llama-profile.env
ExecStart=
ExecStart=/root/llama.cpp/build/bin/llama-server --host 127.0.0.1 --port 8080 --no-webui --models-dir /etc/vram-governor/llama-models --models-max 1 --no-models-autoload --ctx-size ${LLAMA_CTX_SIZE} --parallel ${LLAMA_PARALLEL} --metrics
