# Compatibility endpoint for nodes still configured for :18082.
# Keep TLS and controller authentication; never accept plaintext node tokens.
server {
    listen 0.0.0.0:18082 ssl;
    server_name 10.0.0.115;
    ssl_certificate /etc/vram-governor/tls/controller.crt;
    ssl_certificate_key /etc/vram-governor/tls/controller.key;

    location = /ws/node {
        proxy_pass https://10.0.0.115:8443;
        proxy_http_version 1.1;
        proxy_set_header Host 10.0.0.115:8443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_ssl_trusted_certificate /etc/vram-governor/tls/controller.crt;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name 10.0.0.115;
    }

    location = /healthz {
        proxy_pass https://10.0.0.115:8443;
        proxy_set_header Host 10.0.0.115:8443;
        proxy_ssl_trusted_certificate /etc/vram-governor/tls/controller.crt;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name 10.0.0.115;
    }

    location / { return 404; }
}
