# VRAM Governor node agent config.
# This node is co-located with the RTX 3080.
controller_url: "ws://127.0.0.1:8080/ws/node"
token: "dev-node-token"
# Production wss connections require token_env and an empty literal token.
token_env: ""
command_signing_secret: ""
command_signing_secret_env: "VRAM_NODE_COMMAND_SECRET"
command_state_path: "data/node-command-state.json"

node_id: "gpu-node-01"
node_name: "rtx3080-workstation"
log_level: "info"

# Capability flags, not an architectural split (architecture.md §45 #33/#34).
location_class: "local"       # local | remote
power_control_mode: "manual"  # auto | manual | off | dont_touch | external

# Optional per-GPU performance control. This is separate from node power
# (power_control_mode). Calibrate commands on the actual card before enabling.
# The controller selects only idle/active and never sends shell or clock values.
# gpu_performance:
#   accelerators:
#     - index: 0
#       idle_command: ["/usr/bin/nvidia-smi", "-i", "0", "--lock-gpu-clocks=300,450"]
#       active_command: ["/usr/bin/nvidia-smi", "-i", "0", "--reset-gpu-clocks"]

heartbeat_interval_seconds: 2
capability_refresh_seconds: 30
reconnect_min_seconds: 1
reconnect_max_seconds: 15

# Production LLM checkpointing is fail-closed and disabled by default. Enable
# only after a live signed pause/save/stop/reload/restore/reuse proof.
checkpoint:
  enabled: false
  proof_exercise_enabled: false
  root: "/var/lib/vram-governor/checkpoints"
  max_bytes: 0
  max_files: 0
  per_owner_max_bytes: 0
  per_owner_max_files: 0
  max_metadata_bytes: 1048576
  max_output_bytes: 1048576
  expiry_seconds: 86400
  cleanup_interval_seconds: 300
  proof_path: "/var/lib/vram-governor/checkpoints/production-proof.json"
  # Separate durable node-local issuance high-water. Never place this in a
  # controller-shared filesystem or rely on process memory for proof epochs.
  issuance_state_path: "/var/lib/vram-governor/checkpoints/production-proof-issuance.json"

llamacpp:
  servers:
    # Add one entry per already-running llama-server. /v1/models and /slots
    # are inspected at registration; context_limit/slots are fallbacks only.
    - id: "local-llama-short"
      endpoint: "http://127.0.0.1:8081"
      public_endpoint: "http://127.0.0.1:8081"
      accelerator_index: 0
      router_managed: false
      max_resident_models: 1
      context_limit: 8192
      slots: 4
      runtime_args: ["--ctx-size", "8192", "--parallel", "4"]

comfyui:
  # Set endpoint to enable discovery; no installation or upgrade is performed.
  endpoint: ""
  public_endpoint: ""
  accelerator_index: 0
